<style>
/* Layout: workshop control board — top bar with section tabs, one working column of lists, records open in a side sheet. */
:root {
  --bg: #f3f4f2;
  --surface: #ffffff;
  --sunken: #eceeeb;
  --fg: #1c2023;
  --muted: #5f676d;
  --line: #d9ddd9;
  --accent: #b7791f;        /* amarillo de seguridad, apagado */
  --accent-ink: #1c2023;
  --accent-soft: #f6ead3;
  --ink-bar: #22282c;       /* barra superior grafito */
  --ink-bar-fg: #e9ecea;
  --ok: #1f7a4d;   --ok-soft: #dcefe4;
  --warn: #9a5b00; --warn-soft: #f8e8cc;
  --bad: #b3261e;  --bad-soft: #f7dedb;
  --info: #2b5c8a; --info-soft: #dde8f3;
  --plate: #fbfaf3;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191b; --surface: #1d2225; --sunken: #262c30; --fg: #e6e9e7; --muted: #9aa3a8; --line: #333b40;
    --accent: #e0a33a; --accent-ink: #15191b; --accent-soft: #3a2f1c;
    --ink-bar: #0e1112; --ink-bar-fg: #e6e9e7;
    --ok: #5cc28d; --ok-soft: #1c3428; --warn: #e5a54a; --warn-soft: #3b2e19;
    --bad: #f08a80; --bad-soft: #3d201e; --info: #8bb8e3; --info-soft: #1d2d3d; --plate: #262c30;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191b; --surface: #1d2225; --sunken: #262c30; --fg: #e6e9e7; --muted: #9aa3a8; --line: #333b40;
  --accent: #e0a33a; --accent-ink: #15191b; --accent-soft: #3a2f1c;
  --ink-bar: #0e1112; --ink-bar-fg: #e6e9e7;
  --ok: #5cc28d; --ok-soft: #1c3428; --warn: #e5a54a; --warn-soft: #3b2e19;
  --bad: #f08a80; --bad-soft: #3d201e; --info: #8bb8e3; --info-soft: #1d2d3d; --plate: #262c30;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink-bar); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--info); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; }

/* Top bar */
.topbar { background: var(--ink-bar); color: var(--ink-bar-fg); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.topbar .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; padding-bottom: 10px; }
.brand-mark { width: 30px; height: 30px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex-shrink: 0; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; color: var(--ink-bar-fg); opacity: .72; padding: 10px 12px 12px; cursor: pointer; white-space: nowrap; font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-bottom: 3px solid transparent; }
.tab:hover { opacity: 1; }
.tab[aria-current="page"] { opacity: 1; border-bottom-color: var(--accent); }

main { padding-block: 24px 64px; }
.head { display: flex; align-items: end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.1; margin: 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; margin: 0; text-transform: uppercase; letter-spacing: .03em; }
h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.sub { color: var(--muted); margin: 4px 0 0; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; text-decoration: none; color: var(--fg); white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.small { padding: 4px 10px; font-size: .88rem; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .8rem; color: var(--muted); font-weight: 500; }
input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 76px; resize: vertical; }
.search { width: 260px; max-width: 100%; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.span2 { grid-column: 1 / -1; }

/* Panels & tables */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.panel-pad { padding: 16px; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--sunken); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted); }
.strong { font-weight: 600; }

/* License plate — the shop's own way of naming a car */
.plate { display: inline-block; font-family: var(--font-mono); font-weight: 600; letter-spacing: .12em; background: var(--plate); color: var(--fg); border: 1.5px solid var(--fg); border-radius: 4px; padding: 1px 7px; font-size: .86rem; white-space: nowrap; }

/* Status pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-borrador { background: var(--sunken); color: var(--muted); }
.st-enviada { background: var(--info-soft); color: var(--info); }
.st-aprobada { background: var(--ok-soft); color: var(--ok); }
.st-rechazada { background: var(--bad-soft); color: var(--bad); }
.st-vencida { background: var(--warn-soft); color: var(--warn); }

/* Dashboard */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.stat .label { font-size: .76rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.stat .value { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat.hl { border-color: var(--accent); background: var(--accent-soft); }
.two-col { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .two-col { grid-template-columns: minmax(0, 1fr); } }

/* Empty state */
.empty { padding: 36px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty strong { color: var(--fg); font-size: 1.05rem; }
.notice { padding: 12px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); margin-bottom: 16px; }
.notice.info { background: var(--info-soft); color: var(--info); }

/* Sheet (record detail / forms) */
.scrim { position: fixed; inset: 0; background: rgb(10 12 14 / .5); z-index: 20; display: flex; justify-content: flex-end; }
.sheet { background: var(--bg); width: min(760px, 100%); height: 100%; overflow-y: auto; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet-head { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 18px; display: flex; align-items: center; gap: 12px; z-index: 1; }
.sheet-head h2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.sheet-foot { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: auto; }
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.dl dt { color: var(--muted); font-size: .88rem; }
.dl dd { margin: 0; overflow-wrap: anywhere; }
.err { color: var(--bad); font-size: .9rem; min-height: 1.2em; margin: 0; }
.confirm { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgb(10 12 14 / .45); padding: 16px; }
.confirm .box { background: var(--surface); border-radius: var(--radius); padding: 20px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px; }

/* Quote items editor */
.items td { padding: 6px 4px; }
.items input, .items select { padding: 6px 8px; }
.items .c-kind { width: 132px; }
.items .c-qty { width: 76px; }
.items .c-price { width: 112px; }
.items .c-amt { width: 110px; }
.totals { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; margin-left: auto; width: min(320px, 100%); font-variant-numeric: tabular-nums; }
.totals .grand { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; border-top: 2px solid var(--fg); padding-top: 6px; margin-top: 4px; }
.send-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.send-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.send-card p { margin: 0; color: var(--muted); font-size: .88rem; }
.msg-preview { white-space: pre-wrap; background: var(--sunken); border-radius: var(--radius); padding: 10px 12px; font-size: .9rem; max-height: 180px; overflow-y: auto; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: var(--radius); z-index: 40; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
@media (max-width: 560px) { h1 { font-size: 1.6rem; } .search { width: 100%; } .toolbar { width: 100%; } }
.logo { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; background: #fff; border: 1px solid var(--line); flex-shrink: 0; }
.logo svg { width: 18px; height: 18px; }
.logo.lg { width: 46px; height: 46px; border-radius: 8px; }
.logo.lg svg { width: 30px; height: 30px; }
.mono-logo { font: 700 .72rem/1 var(--font-display); color: #22282c; letter-spacing: .03em; }
.mono-logo.lg { font-size: 1.05rem; }
.look { border: 1px solid var(--line); border-radius: var(--radius); background: var(--sunken); padding: 14px 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.look-brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; text-transform: uppercase; letter-spacing: .03em; }
.look .car { width: min(280px, 100%); height: auto; }
.look-model { font-size: .82rem; color: var(--muted); }
.veh-cell { display: inline-flex; align-items: center; gap: 8px; }
.mini-car { width: 84px; height: auto; vertical-align: middle; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgb(0 0 0 / .25); cursor: pointer; padding: 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw.other { width: auto; border-radius: 999px; padding: 0 12px; font-size: .82rem; background: var(--surface); color: var(--fg); border-color: var(--line); }
</style>

function carSvg(tipo, hex, label = '') {

}
function initials(marca) {
  const m = String(marca || '').replace(/\(.*\)/, '').trim();
  if (/^[A-Z0-9]{2,4}$/.test(m)) return m;
  const parts = m.split(/[\s-]+/).filter(Boolean);
  return (parts.length > 1 ? parts.slice(0, 2).map((p) => p[0]).join('') : m.slice(0, 2)).toUpperCase() || '?';
}

}

// ---------- Helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d) => new Date(Date.now() + d * 864e5).toISOString().slice(0, 10);
function money(n, cur = S.config.moneda) {
  const v = Number(n) || 0;
  try { return new Intl.NumberFormat('es', { style: 'currency', currency: cur || 'USD', minimumFractionDigits: 2 }).format(v); }
  catch { return `${cur || ''} ${v.toFixed(2)}`.trim(); }
}
function fdate(s) {
  if (!s) return '—';
  const d = new Date(s.length === 10 ? s + 'T12:00:00' : s);
  return isNaN(d) ? '—' : d.toLocaleDateString('es', { day: '2-digit', month: 'short', year: 'numeric' });
}
function totals(q) {
  const sub = r2((q.items || []).reduce((s, i) => s + (Number(i.cantidad) || 0) * (Number(i.precio) || 0), 0));
  const desc = r2(Math.min(Number(q.descuento) || 0, sub));
  const imp = r2((sub - desc) * (Number(q.impuesto) || 0) / 100);
  return { sub, desc, imp, total: r2(sub - desc + imp) };
}
const byId = (list, id) => list.find((x) => x.id === id);
const cliente = (id) => byId(S.clientes, id);
const vehiculo = (id) => byId(S.vehiculos, id);
const expired = (q) => q.estado === 'enviada' && q.validez && q.validez < today();
const pill = (q) => expired(q) ? '<span class="pill st-vencida">Vencida</span>' : `<span class="pill st-${esc(q.estado)}">${ESTADOS[q.estado] || esc(q.estado)}</span>`;
const plate = (p) => p ? `<span class="plate">${esc(p)}</span>` : '<span class="muted">—</span>';
const digits = (s) => String(s || '').replace(/\D/g, '');

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200);
}
async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch { if (fallbackEl) { fallbackEl.focus(); const range = document.createRange(); range.selectNodeContents(fallbackEl); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); } return false; }
}
function dbErr(e) {
  if (!e) return 'No se pudo guardar.';
  if (e.code === 'invalid_argument') return 'No tienes permiso para modificar estos datos. Pide al dueño de la página acceso de colaborador o editor.';
  if (e.code === 'quota_exceeded') return 'Se alcanzó el límite de almacenamiento. Elimina registros antiguos para continuar.';
  if (e.code === 'resource_exhausted') return 'Demasiadas operaciones seguidas. Espera unos segundos e inténtalo de nuevo.';
  return e.message || 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';
}
async function save(col, id, data) {
  if (!S.db) throw { message: 'Abre esta página desde claude.ai con tu sesión iniciada para guardar datos.' };
  const ref = id ? S.db.collection(col).doc(id) : S.db.collection(col).doc();
  await ref.set(data);
  upsertLocal(col, { id: ref.id, ...data });
  return ref.id;
}
async function patch(col, id, data) {
  await S.db.collection(col).doc(id).update(data);
  const cur = byId(S[col] || [], id);
  if (cur) upsertLocal(col, { ...cur, ...data });
}
// Show a write right away; the next snapshot replaces the list with the server's copy.
function upsertLocal(col, rec) {
  if (!Array.isArray(S[col])) return;
  const i = S[col].findIndex((x) => x.id === rec.id);
  if (i >= 0) S[col][i] = rec; else S[col].unshift(rec);
}
async function remove(col, id) { await S.db.collection(col).doc(id).delete(); }

// ---------- Confirm ----------
function ask(message, okLabel = 'Eliminar') {
  return new Promise((resolve) => {
    const el = document.createElement('div');
    el.className = 'confirm';
    el.innerHTML = `<div class="box" role="dialog" aria-modal="true"><p style="margin:0">${esc(message)}</p>
      <div class="toolbar" style="justify-content:flex-end"><button class="btn" data-no>Cancelar</button><button class="btn primary" data-yes>${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(el);
    const done = (v) => { el.remove(); resolve(v); };
    $('[data-no]', el).onclick = () => done(false);
    $('[data-yes]', el).onclick = () => done(true);
    $('[data-yes]', el).focus();
  });
}

let sheetRefresh = null;
function openSheet(title, body, foot = '', onRefresh = null) {
  const layer = $('#layer');
  layer.innerHTML = `<div class="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><h2>${esc(title)}</h2><button class="btn ghost small" data-close aria-label="Cerrar">✕ Cerrar</button></div>
    <div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}</section></div>`;
  $('[data-close]', layer).onclick = closeSheet;
  $('.scrim', layer).addEventListener('mousedown', (e) => { if (e.target.classList.contains('scrim')) closeSheet(); });
  sheetRefresh = onRefresh;
  const first = $('.sheet-body input, .sheet-body select, .sheet-body textarea', layer);
  if (first) first.focus();
  return $('.sheet', layer);
}
function closeSheet() { $('#layer').innerHTML = ''; sheetRefresh = null; }

function go(view) {
  if (!VIEWS.includes(view)) view = 'inicio';
  S.view = view;
  try { if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view); } catch {}
  $$('.tab').forEach((t) => t.setAttribute('aria-current', t.dataset.view === view ? 'page' : 'false'));
  renderView(true);
}

let shellOf = null;
function renderView(force) {

  const sheet = openSheet(c ? 'Editar cliente' : 'Nuevo cliente', `<div class="grid2">
    ${input('f-nombre', 'Nombre completo o razón social', x.nombre, { req: true, span: true })}

    ${input('f-correo', 'Correo', x.correo, { type: 'email' })}
    ${input('f-direccion', 'Dirección', x.direccion)}
    ${input('f-notas', 'Notas', x.notas, { area: true, span: true })}</div><p class="err" id="f-err"></p>`,
  `<button class="btn" data-cancel>Cancelar</button><button class="btn primary" data-save>Guardar cliente</button>`);

    e.target.disabled = true;

      const id = await save('clientes', c?.id, { nombre, documento: val(sheet, 'f-documento'), telefono: val(sheet, 'f-telefono'), correo,

function showClient(id) {
  const draw = () => {
    const c = cliente(id);
    if (!c) { closeSheet(); return; }
    const vs = S.vehiculos.filter((v) => v.clienteId === id);
    const qs = S.cotizaciones.filter((q) => q.clienteId === id);
    const sheet = $('#layer .sheet') && sheetRefresh === draw ? $('#layer .sheet') : null;
    const body = `<dl class="dl">
      <dt>Documento</dt><dd>${esc(c.documento || '—')}</dd><dt>WhatsApp</dt><dd class="mono">${esc(c.telefono || '—')}</dd>
      <dt>Correo</dt><dd>${esc(c.correo || '—')}</dd><dt>Dirección</dt><dd>${esc(c.direccion || '—')}</dd>

      <section class="panel"><div class="panel-pad head" style="margin:0;padding-bottom:0"><h2>Vehículos</h2>${S.canWrite ? '<button class="btn small" data-add-veh>+ Agregar vehículo</button>' : ''}</div>
      ${vs.length ? vehicleTable(vs, false) : '<div class="empty"><span>Este cliente no tiene vehículos registrados.</span></div>'}</section>
      <section class="panel"><div class="panel-pad" style="padding-bottom:0"><h2>Cotizaciones</h2></div>${quoteTable(qs, 'Sin cotizaciones para este cliente')}</section>`;

    const s = sheet || openSheet(c.nombre, body, foot, draw);

    $('[data-add-veh]', s)?.addEventListener('click', () => editVehicle(null, id, () => showClient(id)));
    if (!S.canWrite) return;
    $('[data-edit]', s).onclick = () => editClient(c, () => showClient(id));
    $('[data-quote]', s).onclick = () => editQuote(null, { clienteId: id });

  const opts = [['', 'Selecciona el propietario…'], ...[...S.clientes].sort((a, b) => a.nombre.localeCompare(b.nombre)).map((c) => [c.id, c.nombre])];

    <div class="span2" id="f-look"></div>

    <label class="field"><span>Modelo *</span><select id="f-modelo-sel"></select><input id="f-modelo-otro" placeholder="Escribe el modelo" hidden></label>

    <div class="field span2"><span>Color</span><div class="swatches" id="f-swatches">${COLORES.map(([n, h]) => `<button type="button" class="sw" data-color="${esc(n)}" title="${esc(n)}" aria-label="${esc(n)}" style="background:${h}"></button>`).join('')}<button type="button" class="sw other" data-color="${OTRA}">Otro…</button></div><input id="f-color-otro" placeholder="Escribe el color" hidden></div>
    ${input('f-km', 'Kilometraje', x.km, { type: 'number', attrs: 'min="0"' })}
    ${input('f-vin', 'VIN / número de serie', x.vin, { span: true })}
    ${input('f-notas', 'Notas', x.notas, { area: true, span: true })}</div><p class="err" id="f-err"></p>`,
  `<button class="btn" data-cancel>Cancelar</button><button class="btn primary" data-save>Guardar vehículo</button>`);
  $('[data-cancel]', sheet).onclick = closeSheet;
  // Marca → modelos: each list ends with "Otra…", which reveals a text box for anything not listed.
  const mSel = $('#f-marca-sel', sheet), mOtra = $('#f-marca-otra', sheet), moSel = $('#f-modelo-sel', sheet), moOtro = $('#f-modelo-otro', sheet);
  const marcaKnown = !x.marca || MARCAS.includes(x.marca);
  mSel.innerHTML = `<option value="">Selecciona la marca…</option>${MARCAS.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join('')}<option value="${OTRA}">Otra marca…</option>`;
  mSel.value = x.marca ? (marcaKnown ? x.marca : OTRA) : '';
  mOtra.value = marcaKnown ? '' : x.marca;
  const fillModelos = (selected) => {
    const marca = mSel.value;
    const list = marca === OTRA ? [] : modelosDe(marca);
    mOtra.hidden = marca !== OTRA;
    moSel.disabled = !marca;
    moSel.innerHTML = !marca ? '<option value="">Primero elige la marca</option>'
      : `<option value="">${list.length ? 'Selecciona el modelo…' : 'Escribe el modelo abajo'}</option>${list.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join('')}<option value="${OTRA}">Otro modelo…</option>`;
    if (selected && list.includes(selected)) { moSel.value = selected; moOtro.value = ''; }
    else if (selected) { moSel.value = OTRA; moOtro.value = selected; }
    else if (marca === OTRA) moSel.value = OTRA;
    moOtro.hidden = moSel.value !== OTRA;
  };
  fillModelos(x.modelo);
  mSel.onchange = () => { fillModelos(''); (mSel.value === OTRA ? mOtra : moSel).focus(); };
  moSel.onchange = () => { moOtro.hidden = moSel.value !== OTRA; if (!moOtro.hidden) moOtro.focus(); };
  const pick = (sel, other) => (sel.value === OTRA ? other.value.trim() : sel.value);
  // Live preview: logo of the brand, body silhouette in the chosen color, model underneath.
  const bodySel = $('#f-carroceria', sheet), colorOtro = $('#f-color-otro', sheet);
  const known = (c) => COLORES.some(([n]) => n === c);
  let color = x.color || '', otherOn = Boolean(x.color && !known(x.color)), bodyTouched = Boolean(x.carroceria);
  if (otherOn) colorOtro.value = x.color;
  const paintSwatches = () => {
    $$('.sw', sheet).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.color === OTRA ? otherOn : !otherOn && b.dataset.color === color)));
    colorOtro.hidden = !otherOn;
  };
  const autoBody = () => { if (!bodyTouched) bodySel.value = guessBody(pick(mSel, mOtra), pick(moSel, moOtro)); };
  const preview = () => { $('#f-look', sheet).innerHTML = vehicleLook({ marca: pick(mSel, mOtra), modelo: pick(moSel, moOtro), anio: val(sheet, 'f-anio'), color, carroceria: bodySel.value }); };
  bodySel.value = x.carroceria || guessBody(x.marca, x.modelo);
  $('#f-swatches', sheet).onclick = (e) => {
    const b = e.target.closest('.sw'); if (!b) return;
    otherOn = b.dataset.color === OTRA;
    color = otherOn ? colorOtro.value.trim() : b.dataset.color;
    paintSwatches(); preview();
    if (otherOn) colorOtro.focus();
  };
  colorOtro.oninput = () => { color = colorOtro.value.trim(); preview(); };
  bodySel.onchange = () => { bodyTouched = true; };
  sheet.addEventListener('change', (e) => { if (e.target === mSel || e.target === moSel) autoBody(); preview(); });
  sheet.addEventListener('input', (e) => { if (e.target === mOtra || e.target === moOtro) autoBody(); preview(); });
  paintSwatches(); preview();
  $('[data-save]', sheet).onclick = async (e) => {
    const placa = val(sheet, 'f-placa').toUpperCase().replace(/\s+/g, ' ');
    const d = { clienteId: val(sheet, 'f-cliente'), placa, marca: pick(mSel, mOtra), modelo: pick(moSel, moOtro),
      anio: val(sheet, 'f-anio') ? parseInt(val(sheet, 'f-anio'), 10) : '', color, carroceria: bodySel.value,
      km: val(sheet, 'f-km') ? parseInt(val(sheet, 'f-km'), 10) : '', vin: val(sheet, 'f-vin'), notas: val(sheet, 'f-notas'), creado: x.creado || new Date().toISOString() };
    if (!d.clienteId || !d.placa || !d.marca || !d.modelo) return void ($('#f-err').textContent = 'Completa propietario, placa, marca y modelo.');
    if (S.vehiculos.some((o) => o.id !== v?.id && (o.placa || '').toUpperCase() === placa)) return void ($('#f-err').textContent = `Ya existe un vehículo con la placa ${placa}.`);
    e.target.disabled = true;
    try { const id = await save('vehiculos', v?.id, d); toast('Vehículo guardado'); after ? after(id) : showVehicle(id); }
    catch (err) { $('#f-err').textContent = dbErr(err); e.target.disabled = false; }
  };
}

    </div>
    <section><h3>Detalle del trabajo</h3>
      <div class="table-scroll"><table class="items"><thead><tr><th class="c-kind">Tipo</th><th>Descripción</th><th class="num c-qty">Cant.</th><th class="num c-price">Precio unit.</th><th class="num c-amt">Importe</th><th></th></tr></thead><tbody id="items"></tbody></table></div>
      <div class="toolbar" style="margin-top:8px"><button class="btn small" data-add="mano_obra">+ Mano de obra</button><button class="btn small" data-add="repuesto">+ Repuesto</button><button class="btn small" data-add="otro">+ Otro</button></div>
    </section>
    <div class="grid2" style="align-items:start">
      ${input('f-notas', 'Observaciones para el cliente', x.notas, { area: true, attrs: 'placeholder="Ej: Garantía de 3 meses en mano de obra. Repuestos sujetos a disponibilidad."' })}
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="grid2" style="grid-template-columns:1fr 1fr">${input('f-descuento', `Descuento (${S.config.moneda})`, x.descuento, { type: 'number', attrs: 'min="0" step="0.01"' })}${input('f-impuesto', 'Impuesto (%)', x.impuesto, { type: 'number', attrs: 'min="0" max="100" step="0.01"' })}</div>
        <div class="totals" id="tot"></div>
      </div>
    </div><p class="err" id="f-err"></p>`,
  `<button class="btn" data-cancel>Cancelar</button><button class="btn primary" data-save>Guardar cotización</button>`);

  const cliSel = $('#f-cliente', sheet), vehSel = $('#f-vehiculo', sheet), tbody = $('#items', sheet);
  const fillVeh = (sel) => {
    const vs = S.vehiculos.filter((v) => v.clienteId === cliSel.value);
    vehSel.innerHTML = `<option value="">${cliSel.value ? (vs.length ? 'Sin vehículo' : 'Este cliente no tiene vehículos') : '—'}</option>` +
      vs.map((v) => `<option value="${esc(v.id)}" ${v.id === sel ? 'selected' : ''}>${esc(v.placa)} · ${esc(v.marca)} ${esc(v.modelo)}</option>`).join('');
  };
  cliSel.onchange = () => fillVeh('');
  fillVeh(x.vehiculoId);

  const row = (i) => `<tr><td class="c-kind"><select data-k="tipo">${Object.entries(TIPOS).map(([k, l]) => `<option value="${k}" ${k === i.tipo ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
    <td style="min-width:180px"><input data-k="desc" value="${esc(i.desc)}" placeholder="Ej: Cambio de pastillas delanteras"></td>
    <td class="c-qty"><input data-k="cantidad" class="num" type="number" min="0" step="0.01" value="${esc(i.cantidad)}"></td>
    <td class="c-price"><input data-k="precio" class="num" type="number" min="0" step="0.01" value="${esc(i.precio)}"></td>
    <td class="num c-amt" data-amt></td><td><button class="btn ghost small" data-rm aria-label="Quitar línea">✕</button></td></tr>`;
  const read = () => $$('tr', tbody).map((tr) => ({ tipo: $('[data-k=tipo]', tr).value, desc: $('[data-k=desc]', tr).value.trim(),
    cantidad: Number($('[data-k=cantidad]', tr).value) || 0, precio: r2(Number($('[data-k=precio]', tr).value) || 0) }));
  const recalc = () => {
    $$('tr', tbody).forEach((tr) => { $('[data-amt]', tr).textContent = money((Number($('[data-k=cantidad]', tr).value) || 0) * (Number($('[data-k=precio]', tr).value) || 0)); });
    const t = totals({ items: read(), descuento: $('#f-descuento', sheet).value, impuesto: $('#f-impuesto', sheet).value });
    $('#tot', sheet).innerHTML = `<span>Subtotal</span><span class="num">${money(t.sub)}</span>${t.desc ? `<span>Descuento</span><span class="num">−${money(t.desc)}</span>` : ''}
      <span>Impuesto</span><span class="num">${money(t.imp)}</span><span class="grand">Total</span><span class="grand num">${money(t.total)}</span>`;
  };
  x.items.forEach((i) => tbody.insertAdjacentHTML('beforeend', row(i)));
  recalc();
  $$('[data-add]', sheet).forEach((b) => b.onclick = () => { tbody.insertAdjacentHTML('beforeend', row({ tipo: b.dataset.add, desc: '', cantidad: 1, precio: 0 })); recalc(); $('tr:last-child [data-k=desc]', tbody).focus(); });
  tbody.addEventListener('click', (e) => { if (e.target.closest('[data-rm]')) { e.target.closest('tr').remove(); recalc(); } });
  sheet.addEventListener('input', recalc);
  $('[data-cancel]', sheet).onclick = () => (q ? showQuote(q.id) : closeSheet());
  $('[data-save]', sheet).onclick = async (e) => {
    const items = read().filter((i) => i.desc || i.precio);
    if (!cliSel.value) return void ($('#f-err').textContent = 'Selecciona el cliente.');
    if (!items.length) return void ($('#f-err').textContent = 'Agrega al menos una línea con descripción y precio.');
    if (items.some((i) => !i.desc)) return void ($('#f-err').textContent = 'Cada línea necesita una descripción.');
    const data = { ...(q || {}), clienteId: cliSel.value, vehiculoId: vehSel.value, validez: val(sheet, 'f-validez'), tecnico: val(sheet, 'f-tecnico'),
      notas: val(sheet, 'f-notas'), descuento: Math.max(0, Number(val(sheet, 'f-descuento')) || 0), impuesto: Math.max(0, Math.min(100, Number(val(sheet, 'f-impuesto')) || 0)), items };
    delete data.id;
    if (!q) Object.assign(data, { numero: nextNumber(), estado: 'borrador', creada: new Date().toISOString(), creadaPor: S.myId || '' });
    e.target.disabled = true;
    try { const id = await save('cotizaciones', q?.id, data); toast(q ? 'Cotización actualizada' : `Cotización ${data.numero} creada`); showQuote(id); }
    catch (err) { $('#f-err').textContent = dbErr(err); e.target.disabled = false; }
  };
}

function quoteMessage(q, extra = '') {
  const c = cliente(q.clienteId), v = vehiculo(q.vehiculoId), t = totals(q), cfg = S.config;
  const lines = q.items.map((i) => `• ${i.desc}${i.cantidad !== 1 ? ` (x${i.cantidad})` : ''}: ${money(i.cantidad * i.precio)}`).join('\n');
  return [
    `Hola ${c?.nombre || ''}, te saluda ${cfg.nombre}.`,
    extra,
    `Te compartimos la cotización ${q.numero}${v ? ` para tu ${v.marca} ${v.modelo} (placa ${v.placa})` : ''}:`,
    '', lines, '',
    `Subtotal: ${money(t.sub)}`,
    t.desc ? `Descuento: −${money(t.desc)}` : '',
    t.imp ? `Impuesto (${q.impuesto}%): ${money(t.imp)}` : '',
    `TOTAL: ${money(t.total)}`,
    q.validez ? `Válida hasta el ${fdate(q.validez)}.` : '',
    q.notas ? `\n${q.notas}` : '',
    '', 'Responde a este mensaje para aprobarla o si tienes alguna pregunta.',
    [cfg.telefono, cfg.correo, cfg.direccion].filter(Boolean).join(' · '),
  ].filter((l, i, a) => l !== '' || (a[i - 1] !== '' && i > 0)).join('\n').trim();
}

  const c = cliente(q.clienteId) || {}, v = vehiculo(q.vehiculoId), t = totals(q), cfg = S.config;
  const m = (n) => esc(money(n));
  return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cotización ${esc(q.numero)} · ${esc(cfg.nombre)}</title><style>

${t.imp ? `<div><span>Impuesto (${esc(q.impuesto)}%)</span><span>${m(t.imp)}</span></div>` : ''}<div class="g"><span>Total</span><span>${m(t.total)}</span></div></div>

function showQuote(id) {
  const draw = () => {
    const q = byId(S.cotizaciones, id);
    if (!q) { closeSheet(); return; }
    const c = cliente(q.clienteId), v = vehiculo(q.vehiculoId), t = totals(q), tec = byId(S.personal, q.tecnico);
    const body = `<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
        <div style="display:flex;gap:10px;align-items:center">${pill(q)}<span class="muted" style="font-size:.88rem">Creada ${fdate(q.creada)}${q.enviada ? ` · enviada ${fdate(q.enviada)}` : ''}${q.respondida ? ` · respuesta ${fdate(q.respondida)}` : ''}</span></div>
        ${S.canWrite ? `<label class="field" style="flex-direction:row;align-items:center;gap:8px"><span>Estado</span><select id="q-estado-set" style="width:auto">${Object.entries(ESTADOS).map(([k, l]) => `<option value="${k}" ${k === q.estado ? 'selected' : ''}>${l}</option>`).join('')}</select></label>` : ''}
      </div>
      <div class="grid2"><div><h3>Cliente</h3>${c ? `<a href="#clientes" data-goto-client="${esc(c.id)}" class="strong">${esc(c.nombre)}</a><div class="muted mono" style="font-size:.88rem">${esc(c.telefono || 'sin WhatsApp')}</div><div class="muted" style="font-size:.88rem">${esc(c.correo || 'sin correo')}</div>` : '<span class="muted">Cliente eliminado</span>'}</div>
      <div><h3>Vehículo</h3>${v ? `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${brandLogo(v.marca)}${plate(v.placa)}<span>${esc(v.marca)} ${esc(v.modelo)} ${esc(v.anio || '')}</span><span class="mini-car">${carSvg(v.carroceria || guessBody(v.marca, v.modelo), colorHex(v.color), v.modelo)}</span></div>` : '<span class="muted">Sin vehículo</span>'}
      <div class="muted" style="font-size:.88rem;margin-top:4px">Válida hasta ${fdate(q.validez)}${tec ? ` · Responsable: ${esc(tec.nombre)}` : ''}</div></div></div>
      <section class="panel"><div class="table-scroll"><table><thead><tr><th>Descripción</th><th>Tipo</th><th class="num">Cant.</th><th class="num">Precio unit.</th><th class="num">Importe</th></tr></thead><tbody>
      ${q.items.map((i) => `<tr><td>${esc(i.desc)}</td><td class="muted">${TIPOS[i.tipo] || ''}</td><td class="num">${esc(i.cantidad)}</td><td class="num">${money(i.precio)}</td><td class="num">${money(i.cantidad * i.precio)}</td></tr>`).join('')}
      </tbody></table></div><div class="panel-pad"><div class="totals"><span>Subtotal</span><span class="num">${money(t.sub)}</span>${t.desc ? `<span>Descuento</span><span class="num">−${money(t.desc)}</span>` : ''}
      <span>Impuesto (${esc(q.impuesto)}%)</span><span class="num">${money(t.imp)}</span><span class="grand">Total</span><span class="grand num">${money(t.total)}</span></div></div></section>
      ${q.notas ? `<div><h3>Observaciones</h3><p style="margin:0;white-space:pre-wrap">${esc(q.notas)}</p></div>` : ''}
      <section style="display:flex;flex-direction:column;gap:10px"><h2>Enviar al cliente</h2>
        ${input('q-extra', 'Mensaje adicional (opcional)', '', { attrs: 'placeholder="Ej: Ya revisamos el sistema de frenos y encontramos lo siguiente."' })}
        <div class="send-grid">
          <div class="send-card"><strong>WhatsApp</strong><p>${c?.telefono ? `Abre un chat con ${esc(c.telefono)} con el detalle ya escrito.` : 'El cliente no tiene WhatsApp registrado. Podrás elegir el contacto en WhatsApp.'}</p><a class="btn ok" target="_blank" rel="noopener" id="send-wa">Enviar por WhatsApp</a></div>
          <div class="send-card"><strong>Correo</strong><p>${c?.correo ? `Abre Gmail con un correo para ${esc(c.correo)} ya redactado.` : 'El cliente no tiene correo registrado.'}</p><a class="btn" target="_blank" rel="noopener" id="send-mail">Redactar en Gmail</a></div>
          <div class="send-card"><strong>Archivo de la cotización</strong><p>Descarga un documento para adjuntar, imprimir o guardar como PDF.</p><button class="btn" id="send-file">Descargar cotización</button></div>
        </div>
        <details><summary class="muted" style="cursor:pointer">Ver o copiar el texto del mensaje</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><div class="msg-preview" id="msg" tabindex="0"></div><div><button class="btn small" id="copy-msg">Copiar texto</button></div></div></details>
        <p class="muted" style="margin:0;font-size:.85rem">Al usar cualquiera de estas opciones, la cotización se marca como enviada. Cuando el cliente responda, cambia el estado a Aprobada o Rechazada.</p>
      </section>`;
    const foot = S.canWrite ? `<button class="btn danger" data-del>Eliminar</button>${q.estado !== 'aprobada' ? '<button class="btn" data-edit>Editar</button>' : ''}<button class="btn" data-dup>Duplicar</button>` : '';
    const existing = sheetRefresh === draw ? $('#layer .sheet') : null;
    const extraPrev = existing ? $('#q-extra', existing)?.value : '';
    const s = existing || openSheet(`Cotización ${q.numero}`, body, foot, draw);
    if (existing) { $('.sheet-body', s).innerHTML = body; $('#q-extra', s).value = extraPrev || ''; }

    const update = () => {
      const msg = quoteMessage(q, $('#q-extra', s).value.trim());
      $('#msg', s).textContent = msg;
      $('#send-wa', s).href = `https://wa.me/${digits(c?.telefono)}?text=${encodeURIComponent(msg)}`;
      const mail = $('#send-mail', s);
      mail.href = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(c?.correo || '')}&su=${encodeURIComponent(`Cotización ${q.numero} - ${S.config.nombre}`)}&body=${encodeURIComponent(msg)}`;
    };
    update();
    $('#q-extra', s).oninput = update;
    const markSent = async () => {
      if (!S.canWrite || q.estado !== 'borrador') return;
      try { await patch('cotizaciones', id, { estado: 'enviada', enviada: new Date().toISOString() }); } catch (err) { toast(dbErr(err)); }
    };
    $('#send-wa', s).addEventListener('click', () => { markSent(); toast('Abriendo WhatsApp…'); });
    $('#send-mail', s).addEventListener('click', () => { markSent(); toast('Abriendo Gmail…'); });
    $('#copy-msg', s).onclick = async () => { const ok = await copyText($('#msg', s).textContent, $('#msg', s)); toast(ok ? 'Texto copiado' : 'Selecciona el texto y cópialo con Ctrl+C'); if (ok) markSent(); };
    $('#send-file', s).onclick = async (e) => {
      const dl = await (window.claude?.use?.('downloads') ?? Promise.resolve(null)).catch(() => null);
      if (!dl) { toast('La descarga no está disponible en esta vista.'); return; }
      e.target.disabled = true;
      try { await dl.save({ filename: `Cotizacion-${q.numero}.html`, data: quoteDocument(q) }); toast('Cotización descargada. Ábrela para imprimirla o guardarla como PDF.'); markSent(); }
      catch (err) { if (err?.code !== 'declined') toast('No se pudo descargar el archivo.'); }
      finally { e.target.disabled = false; }
    };
    $('[data-goto-client]', s)?.addEventListener('click', (e) => { e.preventDefault(); showClient(c.id); });
    if (!S.canWrite) return;
    $('#q-estado-set', s).onchange = async (e) => {
      const estado = e.target.value;
      const d = { estado };
      if (estado === 'aprobada' || estado === 'rechazada') d.respondida = new Date().toISOString();
      if (estado === 'enviada' && !q.enviada) d.enviada = new Date().toISOString();
      try { await patch('cotizaciones', id, d); toast(`Estado: ${ESTADOS[estado]}`); } catch (err) { toast(dbErr(err)); e.target.value = q.estado; }
    };
    $('[data-edit]', s)?.addEventListener('click', () => editQuote(q));
    $('[data-dup]', s).onclick = () => editQuote(null, { draft: { clienteId: q.clienteId, vehiculoId: q.vehiculoId, impuesto: q.impuesto, descuento: q.descuento,
      notas: q.notas, tecnico: q.tecnico, items: structuredClone(q.items) } });
    $('[data-del]', s).onclick = async () => {
      if (!(await ask(`¿Eliminar la cotización ${q.numero}? Esta acción no se puede deshacer.`))) return;
      try { await remove('cotizaciones', id); closeSheet(); toast('Cotización eliminada'); } catch (err) { toast(dbErr(err)); }
    };
  };
  sheetRefresh = null;
  draw();
}
// ---------- Data ----------
function onData() {
  renderView(false);
  if (sheetRefresh && $('#layer .sheet')) {
    const active = document.activeElement;
    // Don't redraw a sheet while someone is typing in it.
    if (!(active && $('#layer').contains(active) && /INPUT|TEXTAREA|SELECT/.test(active.tagName) && active.id !== 'q-estado-set')) sheetRefresh();
  }
}
function subscribe(col, key, sort) {
  S.db.collection(col).limit(1000).onSnapshot((snap) => {
    S[key] = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort(sort);
    S.loaded.add(key);
    S.ready = S.loaded.size >= 4;
    onData();
  }, (err) => { if (err.code === 'revoked') { S.offline = true; onData(); } else toast(dbErr(err)); });
}

async function start() {
  const initial = (location.hash || '').slice(1);
  go(VIEWS.includes(initial) ? initial : 'inicio');
  const use = (n) => (window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, user] = await Promise.all([use('db'), use('user')]);
  S.user = user;
  if (!db) { S.offline = true; S.canWrite = false; renderView(true); return; }
  S.db = db;
  if (user) {
    const [w, admin, myId] = await Promise.all([user.can('data.write'), user.canEdit(), user.id()]);
    S.canWrite = w !== false;
    S.canAdmin = admin || (await user.isOwner());
    S.myId = myId;
  }
  renderView(true);
  db.doc('config/taller').onSnapshot((snap) => { if (snap.exists) { S.config = { ...S.config, ...snap.data() }; onData(); } }, () => {});
  subscribe('clientes', 'clientes', (a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
  subscribe('vehiculos', 'vehiculos', (a, b) => (a.placa || '').localeCompare(b.placa || ''));
  subscribe('cotizaciones', 'cotizaciones', (a, b) => (b.creada || '').localeCompare(a.creada || ''));
  subscribe('personal', 'personal', (a, b) => (a.nombre || '').localeCompare(b.nombre || ''));
}
start();
</script>
